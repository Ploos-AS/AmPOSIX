name: Amiga cross smoke
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  m68k-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate m68k toolchain
        run: |
          command -v m68k-amigaos-gcc
          command -v m68k-amigaos-ar
      - name: Cross-build libamposix
        run: make amiga-smoke
