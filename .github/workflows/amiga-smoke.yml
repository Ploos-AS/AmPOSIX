name: Amiga cross smoke
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: read
jobs:
  m68k-build:
    uses: Ploos-AS/amiga-dev/.github/workflows/reusable-amiga-dev.yml@a786bb71dbd9559e6a50817c548ea3f74f4828e1
    with:
      image: ghcr.io/ploos-as/amiga-dev:sha-a786bb7
      command: make amiga-probes amiga-payload
  publish-q1:
    needs: m68k-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Q1 payload in pinned amiga-dev
        run: |
          docker pull ghcr.io/ploos-as/amiga-dev:sha-a786bb7
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            ghcr.io/ploos-as/amiga-dev:sha-a786bb7 \
            sh -ec 'make amiga-probes amiga-payload'
      - name: Validate runtime payload
        run: |
          test -x build/amiga/payload/amposix-qualification
          jq -e '.schema == 1 and .project == "AmPOSIX" and .architecture == "m68k"' build/amiga/payload/amiga-runtime.json >/dev/null
          test "$(find build/amiga/payload -type f | wc -l)" -eq 2
      - name: Upload Q1 payload
        uses: actions/upload-artifact@v4
        with:
          name: amposix-amiga-q1
          path: build/amiga/payload/
          if-no-files-found: error
