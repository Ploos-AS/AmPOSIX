name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate M0 repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s docs/ROADMAP.md
          test -s docs/COMPATIBILITY.md
          test -s include/amposix/README.md
          test -s ports/README.md
          grep -q "native-first" README.md
          grep -q "Level 0" README.md
          grep -q "fork" docs/COMPATIBILITY.md

      - name: Reject obvious proprietary payloads
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '*.rom' -o -iname '*.adf' -o -iname '*.hdf' \) -print -quit | grep -q .; then
            echo "ROM/disk image payload detected. Keep proprietary runtime assets out of AmPOSIX."
            exit 1
          fi

      - name: Validate Porting Lab baselines
        shell: bash
        run: |
          set -euo pipefail
          test -s porting/hello/hello.c
          test -s porting/hello/port.toml
          cc -std=c89 -Wall -Wextra -Werror -o /tmp/amposix-port-hello porting/hello/hello.c
          /tmp/amposix-port-hello | grep -q "Hello from AmPOSIX Porting Lab!"
          cc -std=c89 -Wall -Wextra -Werror -o /tmp/amposix-port-cat porting/cat/cat.c
          printf 'port-lab-cat\\n' | /tmp/amposix-port-cat | grep -qx 'port-lab-cat'
          cc -std=c89 -Wall -Wextra -Werror -o /tmp/amposix-port-grep porting/grep/grep.c
          printf 'alpha\\nneedle here\\nomega\\n' | /tmp/amposix-port-grep needle | grep -qx 'needle here'
          cc -std=c89 -Wall -Wextra -Werror -o /tmp/amposix-port-wc porting/wc/wc.c
          test "$(printf 'one two\\nthree\\n' | /tmp/amposix-port-wc)" = "2 3 14"
          cc -std=c89 -Wall -Wextra -Werror -Iinclude -o /tmp/amposix-port-date porting/date/date.c lib/time.c platform/host/platform.c
          test "$(/tmp/amposix-port-date)" -gt 0
          cc -std=c89 -Wall -Wextra -Werror -Iinclude -o /tmp/amposix-port-sleep porting/sleep/sleep.c lib/time.c platform/host/platform.c
          test "$(/tmp/amposix-port-sleep)" = "slept"
          cc -std=c89 -Wall -Wextra -Werror -o /tmp/amposix-echo-server porting/netcat/echo-server.c
          cc -std=c89 -Wall -Wextra -Werror -Iinclude -o /tmp/amposix-port-netcat porting/netcat/netcat.c lib/net.c lib/netdb.c platform/host/net_platform.c platform/host/platform.c
          (/tmp/amposix-echo-server 34567 >/tmp/amposix-echo.log 2>&1 & echo $! >/tmp/amposix-echo.pid)
          sleep 1
          printf 'amposix-loopback-test\n' | /tmp/amposix-port-netcat 127.0.0.1 34567 > /tmp/amposix-netcat.out
          kill "$(cat /tmp/amposix-echo.pid)" 2>/dev/null || true
          grep -qx 'amposix-loopback-test' /tmp/amposix-netcat.out
