name: M1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  c-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Scanner smoke test
        run: ./build/amposix scan tests/fixtures/sample.c
